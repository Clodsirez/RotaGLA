<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baú Semanal</title>
<style>
  :root{
    --bg: #1e1e22;
    --panel: #26262b;
    --panel-2: #2c2c32;
    --pink: #ff3d9a;
    --pink-soft: rgba(255,61,154,.35);
    --gold: #e8c96b;
    --text: #f2f0ee;
    --muted: #9a97a3;

    --green: #3ecf6e;
    --yellow: #e8c94a;
    --orange: #f0913c;
    --red: #ef4d63;
    --blue: #4ea3f0;
    --purple: #a86bf0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 15% -10%, #2b2530 0%, var(--bg) 45%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    padding: 24px;
  }

  .frame{
    max-width: 1400px;
    margin: 0 auto;
    border: 2px solid var(--pink);
    border-radius: 10px;
    box-shadow: 0 0 40px var(--pink-soft);
    padding: 28px 32px 36px;
  }

  header{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }
  header h1{
    color: var(--pink);
    font-size: 2.1rem;
    margin: 0;
    letter-spacing: .3px;
  }
  header .credit{
    color: var(--pink);
    font-size: 1.05rem;
    opacity: .9;
  }

  .legend{
    display:flex;
    flex-wrap: wrap;
    gap: 22px;
    background: var(--panel);
    border: 1px solid #3a3a42;
    border-radius: 8px;
    padding: 14px 20px;
    margin-bottom: 22px;
    font-size: .92rem;
  }
  .legend span{
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .dot{
    width: 14px; height: 14px;
    border-radius: 4px;
    display:inline-block;
  }

  .weeks{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    margin-bottom: 26px;
  }
  @media (max-width: 900px){ .weeks{ grid-template-columns: 1fr; } }

  .week-panel{
    border-radius: 10px;
    padding: 18px 20px 22px;
    border: 1px solid;
  }
  .week-panel.current{ border-color: var(--green); }
  .week-panel.next{ border-color: var(--yellow); }

  .week-title{
    text-align:center;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 16px;
    font-size: 1.05rem;
  }
  .week-panel.current .week-title{ color: var(--green); }
  .week-panel.next .week-title{ color: var(--yellow); }

  .bau-row{
    display:grid;
    grid-template-columns: 70px repeat(3, 1fr);
    align-items:center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .bau-row:last-child{ margin-bottom: 0; }
  .bau-label{
    color: var(--gold);
    font-weight: 600;
    font-size: .95rem;
  }

  .chest-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 6px;
  }
  .avatar{
    width: 74px; height: 74px;
    border-radius: 8px;
    border: 2px solid;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1.3rem;
    background: linear-gradient(160deg,#3a3440,#211f26);
  }
  .week-panel.current .avatar{ border-color: var(--green); }
  .week-panel.next .avatar{ border-color: var(--yellow); }
  .chest-card .name{ font-size: .85rem; color: var(--text); }

  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items:center;
    margin-bottom: 18px;
  }
  .controls label{ font-size: .95rem; color: var(--text); margin-right: 8px; }
  .controls input[type=text], .controls select{
    background: var(--panel-2);
    border: 1px solid #45454e;
    color: var(--text);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: .9rem;
  }
  .controls input[type=text]{ min-width: 320px; }
  .check-wrap{ display:flex; align-items:center; gap:8px; font-size:.9rem; }
  .check-wrap input{ accent-color: var(--gold); width:16px; height:16px; }

  .filters{
    display:flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .filter-btn{
    background: transparent;
    border: 1.5px solid var(--pink);
    color: var(--text);
    padding: 9px 20px;
    border-radius: 999px;
    font-size: .9rem;
    cursor: pointer;
    transition: all .15s ease;
  }
  .filter-btn:hover{ background: var(--pink-soft); }
  .filter-btn.active{ background: var(--pink); color: #1e1e22; font-weight: 700; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
  }

  .card{
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid;
    background: linear-gradient(160deg,#3a3440,#211f26);
    cursor: default;
    transition: transform .12s ease;
  }
  .card:hover{ transform: translateY(-3px); }
  .card .img{
    height: 110px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1.6rem;
  }
  .card .date-bar{
    text-align:center;
    font-weight:700;
    padding: 8px 0;
    font-size: 1.05rem;
    letter-spacing: .5px;
  }
  .card .cname{
    text-align:center;
    font-size: .85rem;
    padding: 6px 4px 10px;
    color: var(--text);
  }

  .status-green{ border-color: var(--green); }
  .status-green .date-bar{ background: var(--green); color:#12331e; }
  .status-yellow{ border-color: var(--yellow); }
  .status-yellow .date-bar{ background: var(--yellow); color:#3a2f08; }
  .status-orange{ border-color: var(--orange); }
  .status-orange .date-bar{ background: var(--orange); color:#3a1c04; }
  .status-red{ border-color: var(--red); }
  .status-red .date-bar{ background: var(--red); color:#3a0a12; }
  .status-blue{ border-color: var(--blue); }
  .status-blue .date-bar{ background: var(--blue); color:#062038; }
  .status-purple{ border-color: var(--purple); }
  .status-purple .date-bar{ background: var(--purple); color:#28093f; }

  .empty-msg{
    grid-column: 1/-1;
    text-align:center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 1rem;
  }

  footer{
    text-align:center;
    color: var(--muted);
    font-size: .8rem;
    margin-top: 26px;
  }
</style>
</head>
<body>

<div class="frame">
  <header>
    <h1>Baú Semanal</h1>
    <div class="credit">Créditos a Atiosz pela ideia</div>
  </header>

  <div class="legend">
    <span><span class="dot" style="background:var(--green)"></span>Semana atual</span>
    <span><span class="dot" style="background:var(--yellow)"></span>Até 1 mês</span>
    <span><span class="dot" style="background:var(--orange)"></span>1 a 2 meses</span>
    <span><span class="dot" style="background:var(--red)"></span>Mais de 2 meses</span>
    <span><span class="dot" style="background:var(--blue)"></span>Sem rotação</span>
    <span><span class="dot" style="background:var(--purple)"></span>Ainda não rotacionou</span>
  </div>

  <div class="weeks">
    <div class="week-panel current">
      <div class="week-title">SEMANA ATUAL</div>
      <div id="current-week"></div>
    </div>
    <div class="week-panel next">
      <div class="week-title">PRÓXIMA SEMANA</div>
      <div id="next-week"></div>
    </div>
  </div>

  <div class="controls">
    <div>
      <label for="search">Pesquisar</label>
      <input type="text" id="search" placeholder="Nome ou alias...">
    </div>
    <div>
      <label for="sort">Ordenar</label>
      <select id="sort">
        <option value="name-asc">Name (A-Z)</option>
        <option value="name-desc">Name (Z-A)</option>
        <option value="date-asc">Data (mais antiga)</option>
        <option value="date-desc">Data (mais recente)</option>
      </select>
    </div>
    <div class="check-wrap">
      <input type="checkbox" id="hide-none" checked>
      <label for="hide-none" style="margin:0;">Ocultar sem rotação</label>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn" data-role="Tank">Tank</button>
    <button class="filter-btn" data-role="Bruiser">Bruiser</button>
    <button class="filter-btn" data-role="DPS">DPS</button>
    <button class="filter-btn" data-role="Support">Support</button>
  </div>

  <div class="grid" id="char-grid"></div>

  <footer>Cores e datas são definidas manualmente. Edite CURRENT_WEEK, NEXT_WEEK e CHARACTERS no arquivo para atualizar tudo.</footer>
</div>

<script>
/* =================================================================
   ===========  ÁREA DE EDIÇÃO — só mexa aqui  ====================
   =================================================================

   1) CORES DISPONÍVEIS (bata o nome certinho, minúsculo):
        "green"  -> semana atual
        "yellow" -> até 1 mês
        "orange" -> 1 a 2 meses
        "red"    -> mais de 2 meses
        "blue"   -> sem rotação (item fixo)
        "purple" -> ainda não rotacionou

   2) IMAGEM: campo "img" é opcional. Cole o link direto da imagem
      (ex: "https://meusite.com/imagens/zoro.png").
      Se deixar "" ou remover o campo, mostra as iniciais do nome
      como no exemplo (bolinha com "ZO", "LU" etc).

   3) SEMANA ATUAL / PRÓXIMA SEMANA: são as listas CURRENT_WEEK e
      NEXT_WEEK logo abaixo. Cada uma tem exatamente 6 nomes,
      divididos automaticamente em Baú 1 (3 primeiros) e
      Baú 2 (3 últimos). Só troque os nomes/imagens ali, na ordem
      que quiser.

   4) LISTA COMPLETA: array CHARACTERS, um objeto por personagem:
        name  -> nome exibido
        role  -> "Tank" | "Bruiser" | "DPS" | "Support"
        date  -> texto livre exibido no card, ex: "15/05"
        color -> uma das cores da lista acima
        img   -> (opcional) link da imagem
================================================================= */

// ---------- SEMANA ATUAL (6 nomes = Baú 1 + Baú 2) ----------
const CURRENT_WEEK = [
  {name:"Bastille", img:""},
  {name:"Kaku",     img:""},
  {name:"Lucci",    img:""},
  {name:"Luffy",    img:""},
  {name:"Moria",    img:""},
  {name:"Zoro",     img:""},
];

// ---------- PRÓXIMA SEMANA (6 nomes = Baú 1 + Baú 2) ----------
const NEXT_WEEK = [
  {name:"Killer",  img:""},
  {name:"Brook",   img:""},
  {name:"Bellamy", img:""},
  {name:"Urouge",  img:""},
  {name:"Sanji",   img:""},
  {name:"Franky",  img:""},
];

// ---------- LISTA COMPLETA DE PERSONAGENS ----------
const CHARACTERS = [
  {name:"Apoo",          role:"DPS",     date:"17/04", color:"red",    img:""},
  {name:"Baby 5",        role:"Support", date:"27/03", color:"red",    img:""},
  {name:"Bartolomeo",    role:"Tank",    date:"10/04", color:"red",    img:""},
  {name:"Basil Hawkins", role:"DPS",     date:"13/03", color:"red",    img:""},
  {name:"Bastille",      role:"Tank",    date:"15/05", color:"green",  img:""},
  {name:"Bellamy",       role:"Bruiser", date:"22/05", color:"orange", img:""},
  {name:"Blueno",        role:"Bruiser", date:"24/04", color:"red",    img:""},
  {name:"Bonney",        role:"DPS",     date:"20/03", color:"red",    img:""},
  {name:"Brook",         role:"Support", date:"22/05", color:"orange", img:""},
  {name:"Burgess",       role:"Bruiser", date:"22/05", color:"orange", img:""},

  {name:"Capone Bege",   role:"Tank",    date:"24/04", color:"red",    img:""},
  {name:"Carrot",        role:"Support", date:"08/05", color:"red",    img:""},
  {name:"Chopper",       role:"Support", date:"17/04", color:"red",    img:""},
  {name:"Crocodile",     role:"DPS",     date:"27/03", color:"red",    img:""},
  {name:"Dalmatian",     role:"Tank",    date:"13/03", color:"red",    img:""},
  {name:"Drake",         role:"Tank",    date:"03/04", color:"red",    img:""},
  {name:"Franky",        role:"Support", date:"08/05", color:"red",    img:""},
  {name:"Hina",          role:"Support", date:"10/04", color:"red",    img:""},
  {name:"Ichiji",        role:"DPS",     date:"01/05", color:"red",    img:""},
  {name:"Jabra",         role:"Bruiser", date:"17/04", color:"red",    img:""},

  {name:"Kaku",          role:"Bruiser", date:"15/05", color:"green",  img:""},
  {name:"Kalifa",        role:"Support", date:"08/05", color:"red",    img:""},
  {name:"Kid",           role:"DPS",     date:"08/05", color:"red",    img:""},
  {name:"Killer",        role:"DPS",     date:"22/05", color:"orange", img:""},
  {name:"Koala",         role:"Support", date:"10/04", color:"red",    img:""},
  {name:"Law",           role:"DPS",     date:"03/04", color:"red",    img:""},
  {name:"Leo",           role:"Support", date:"24/04", color:"green",  img:""},
  {name:"Lucci",         role:"Bruiser", date:"15/05", color:"green",  img:""},
  {name:"Luffy",         role:"DPS",     date:"15/05", color:"green",  img:""},
  {name:"Marco",         role:"Tank",    date:"17/04", color:"red",    img:""},

  {name:"Marguerite",    role:"Support", date:"01/05", color:"red",    img:""},
  {name:"Moria",         role:"Support", date:"15/05", color:"green",  img:""},
  {name:"Nami",          role:"Support", date:"03/04", color:"red",    img:""},
  {name:"Niji",          role:"DPS",     date:"20/03", color:"red",    img:""},
  {name:"Perona",        role:"Support", date:"27/03", color:"red",    img:""},
  {name:"Rebecca",       role:"DPS",     date:"24/04", color:"red",    img:""},
  {name:"Reiju",         role:"Support", date:"17/04", color:"red",    img:""},
  {name:"Robin",         role:"Support", date:"24/04", color:"red",    img:""},
  {name:"Ryuma",         role:"Bruiser", date:"20/03", color:"red",    img:""},
  {name:"Sanji",         role:"DPS",     date:"22/05", color:"orange", img:""},

  {name:"Smoker",        role:"Tank",    date:"08/05", color:"red",    img:""},
  {name:"Urouge",        role:"Bruiser", date:"22/05", color:"orange", img:""},
  {name:"Usopp",         role:"DPS",     date:"27/03", color:"red",    img:""},
  {name:"Uta",           role:"Support", date:"20/03", color:"red",    img:""},
  {name:"Van Augur",     role:"DPS",     date:"24/04", color:"red",    img:""},
  {name:"Yonji",         role:"Bruiser", date:"01/05", color:"red",    img:""},
  {name:"Zoro",          role:"DPS",     date:"15/05", color:"green",  img:""},
];

/* =================================================================
   =============  FIM DA ÁREA DE EDIÇÃO  ===========================
   ================================================================= */

function initials(name){
  return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
}

function avatarHTML(c){
  if(c.img){
    return `<img src="${c.img}" alt="${c.name}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;">`;
  }
  return initials(c.name);
}

function renderWeekCards(container, list){
  container.innerHTML = "";
  const bau1 = list.slice(0,3);
  const bau2 = list.slice(3,6);
  [["Baú 1",bau1],["Baú 2",bau2]].forEach(([label, group])=>{
    const row = document.createElement("div");
    row.className = "bau-row";
    const lbl = document.createElement("div");
    lbl.className = "bau-label";
    lbl.textContent = label;
    row.appendChild(lbl);
    group.forEach(c=>{
      const card = document.createElement("div");
      card.className = "chest-card";
      card.innerHTML = `<div class="avatar">${avatarHTML(c)}</div><div class="name">${c.name}</div>`;
      row.appendChild(card);
    });
    container.appendChild(row);
  });
}

renderWeekCards(document.getElementById("current-week"), CURRENT_WEEK);
renderWeekCards(document.getElementById("next-week"), NEXT_WEEK);

// ---------------- Grid principal ----------------
let activeRoles = new Set();
const searchInput = document.getElementById("search");
const sortSelect = document.getElementById("sort");
const hideNone = document.getElementById("hide-none");
const grid = document.getElementById("char-grid");

document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const role = btn.dataset.role;
    if(activeRoles.has(role)){
      activeRoles.delete(role);
      btn.classList.remove("active");
    } else {
      activeRoles.add(role);
      btn.classList.add("active");
    }
    renderGrid();
  });
});
searchInput.addEventListener("input", renderGrid);
sortSelect.addEventListener("change", renderGrid);
hideNone.addEventListener("change", renderGrid);

// helper pra ordenar por data no formato "DD/MM" (ano assumido fixo p/ ordenação)
function parseDMY(d){
  if(!d) return new Date(0);
  const [dd, mm] = d.split("/").map(Number);
  return new Date(2000, (mm||1)-1, dd||1);
}

function renderGrid(){
  let list = [...CHARACTERS];

  if(hideNone.checked){
    list = list.filter(c=>c.color !== "blue");
  }

  const q = searchInput.value.trim().toLowerCase();
  if(q){
    list = list.filter(c=>c.name.toLowerCase().includes(q));
  }

  if(activeRoles.size > 0){
    list = list.filter(c=>activeRoles.has(c.role));
  }

  const sortVal = sortSelect.value;
  list.sort((a,b)=>{
    if(sortVal === "name-asc") return a.name.localeCompare(b.name);
    if(sortVal === "name-desc") return b.name.localeCompare(a.name);
    if(sortVal === "date-asc") return parseDMY(a.date) - parseDMY(b.date);
    if(sortVal === "date-desc") return parseDMY(b.date) - parseDMY(a.date);
    return 0;
  });

  grid.innerHTML = "";
  if(list.length === 0){
    grid.innerHTML = `<div class="empty-msg">Nenhum personagem encontrado.</div>`;
    return;
  }

  list.forEach(c=>{
    const color = c.color || "red";
    const card = document.createElement("div");
    card.className = `card status-${color}`;
    const dateLabel = color === "blue" ? "Fixo" : (color === "purple" ? "—" : (c.date || "—"));
    card.innerHTML = `
      <div class="img">${avatarHTML(c)}</div>
      <div class="date-bar">${dateLabel}</div>
      <div class="cname">${c.name}</div>
    `;
    grid.appendChild(card);
  });
}

renderGrid();
</script>

</body>
</html>
