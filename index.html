<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baú Semanal</title>
<style>
  :root{
    --bg: #1e1e22;
    --panel: #26262b;
    --panel-2: #2c2c32;
    --pink: #ff3d9a;
    --pink-soft: rgba(255,61,154,.35);
    --gold: #e8c96b;
    --text: #f2f0ee;
    --muted: #9a97a3;

    --green: #3ecf6e;
    --yellow: #e8c94a;
    --orange: #f0913c;
    --red: #ef4d63;
    --blue: #4ea3f0;
    --purple: #a86bf0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 15% -10%, #2b2530 0%, var(--bg) 45%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    padding: 24px;
  }

  .frame{
    max-width: 1400px;
    margin: 0 auto;
    border: 2px solid var(--pink);
    border-radius: 10px;
    box-shadow: 0 0 40px var(--pink-soft);
    padding: 28px 32px 36px;
  }

  header{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }
  header h1{
    color: var(--pink);
    font-size: 2.1rem;
    margin: 0;
    letter-spacing: .3px;
  }
  header .credit{
    color: var(--pink);
    font-size: 1.05rem;
    opacity: .9;
  }

  .legend{
    display:flex;
    flex-wrap: wrap;
    gap: 22px;
    background: var(--panel);
    border: 1px solid #3a3a42;
    border-radius: 8px;
    padding: 14px 20px;
    margin-bottom: 22px;
    font-size: .92rem;
  }
  .legend span{
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .dot{
    width: 14px; height: 14px;
    border-radius: 4px;
    display:inline-block;
  }

  .weeks{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    margin-bottom: 26px;
  }
  @media (max-width: 900px){ .weeks{ grid-template-columns: 1fr; } }

  .week-panel{
    border-radius: 10px;
    padding: 18px 20px 22px;
    border: 1px solid;
  }
  .week-panel.current{ border-color: var(--green); }
  .week-panel.next{ border-color: var(--yellow); }

  .week-title{
    text-align:center;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 16px;
    font-size: 1.05rem;
  }
  .week-panel.current .week-title{ color: var(--green); }
  .week-panel.next .week-title{ color: var(--yellow); }

  .bau-row{
    display:grid;
    grid-template-columns: 70px repeat(3, 1fr);
    align-items:center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .bau-row:last-child{ margin-bottom: 0; }
  .bau-label{
    color: var(--gold);
    font-weight: 600;
    font-size: .95rem;
  }

  .chest-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 6px;
  }
  .avatar{
    width: 74px; height: 74px;
    border-radius: 8px;
    border: 2px solid;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1.3rem;
    background: linear-gradient(160deg,#3a3440,#211f26);
    overflow: hidden;
  }
  .week-panel.current .avatar{ border-color: var(--green); }
  .week-panel.next .avatar{ border-color: var(--yellow); }
  .chest-card .name{ font-size: .85rem; color: var(--text); }

  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items:center;
    margin-bottom: 18px;
  }
  .controls label{ font-size: .95rem; color: var(--text); margin-right: 8px; }
  .controls input[type=text], .controls select{
    background: var(--panel-2);
    border: 1px solid #45454e;
    color: var(--text);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: .9rem;
  }
  .controls input[type=text]{ min-width: 320px; }
  .check-wrap{ display:flex; align-items:center; gap:8px; font-size:.9rem; }
  .check-wrap input{ accent-color: var(--gold); width:16px; height:16px; }

  .filters{
    display:flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .filter-btn{
    background: transparent;
    border: 1.5px solid var(--pink);
    color: var(--text);
    padding: 9px 20px;
    border-radius: 999px;
    font-size: .9rem;
    cursor: pointer;
    transition: all .15s ease;
  }
  .filter-btn:hover{ background: var(--pink-soft); }
  .filter-btn.active{ background: var(--pink); color: #1e1e22; font-weight: 700; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
  }

  .card{
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid;
    background: linear-gradient(160deg,#3a3440,#211f26);
    cursor: default;
    transition: transform .12s ease;
  }
  .card:hover{ transform: translateY(-3px); }
  .card .img{
    height: 110px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1.6rem;
    overflow: hidden;
  }
  .card .date-bar{
    text-align:center;
    font-weight:700;
    padding: 8px 0;
    font-size: 1.05rem;
    letter-spacing: .5px;
  }
  .card .cname{
    text-align:center;
    font-size: .85rem;
    padding: 6px 4px 10px;
    color: var(--text);
  }

  .status-green{ border-color: var(--green); }
  .status-green .date-bar{ background: var(--green); color:#12331e; }
  .status-yellow{ border-color: var(--yellow); }
  .status-yellow .date-bar{ background: var(--yellow); color:#3a2f08; }
  .status-orange{ border-color: var(--orange); }
  .status-orange .date-bar{ background: var(--orange); color:#3a1c04; }
  .status-red{ border-color: var(--red); }
  .status-red .date-bar{ background: var(--red); color:#3a0a12; }
  .status-blue{ border-color: var(--blue); }
  .status-blue .date-bar{ background: var(--blue); color:#062038; }
  .status-purple{ border-color: var(--purple); }
  .status-purple .date-bar{ background: var(--purple); color:#28093f; }

  .empty-msg{
    grid-column: 1/-1;
    text-align:center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 1rem;
  }

  footer{
    text-align:center;
    color: var(--muted);
    font-size: .8rem;
    margin-top: 26px;
  }
</style>
</head>
<body>

<div class="frame">
  <header>
    <h1>Baú Semanal</h1>
    <div class="credit">Créditos a Atiosz pela ideia e Labophase pelo Design</div>
  </header>

  <div class="legend">
    <span><span class="dot" style="background:var(--green)"></span>Semana atual</span>
    <span><span class="dot" style="background:var(--yellow)"></span>Até 1 mês</span>
    <span><span class="dot" style="background:var(--orange)"></span>1 a 2 meses</span>
    <span><span class="dot" style="background:var(--red)"></span>Mais de 2 meses</span>
    <span><span class="dot" style="background:var(--blue)"></span>Sem rotação</span>
    <span><span class="dot" style="background:var(--purple)"></span>Ainda não rotacionou</span>
  </div>

  <div class="weeks">
    <div class="week-panel current">
      <div class="week-title">SEMANA ATUAL</div>
      <div id="current-week"></div>
    </div>
    <div class="week-panel next">
      <div class="week-title">PRÓXIMA SEMANA</div>
      <div id="next-week"></div>
    </div>
  </div>

  <div class="controls">
    <div>
      <label for="search">Pesquisar</label>
      <input type="text" id="search" placeholder="Nome ou alias...">
    </div>
    <div>
      <label for="sort">Ordenar</label>
      <select id="sort">
        <option value="name-asc">Name (A-Z)</option>
        <option value="name-desc">Name (Z-A)</option>
        <option value="date-asc">Data (mais antiga)</option>
        <option value="date-desc">Data (mais recente)</option>
      </select>
    </div>
    <div class="check-wrap">
      <input type="checkbox" id="hide-none" checked>
      <label for="hide-none" style="margin:0;">Ocultar sem rotação</label>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn" data-role="Tank">Tank</button>
    <button class="filter-btn" data-role="Bruiser">Bruiser</button>
    <button class="filter-btn" data-role="DPS">DPS</button>
    <button class="filter-btn" data-role="Support">Support</button>
  </div>

  <div class="grid" id="char-grid"></div>

  <footer></footer>
</div>

   ===========  ÁREA DE EDIÇÃO — só mexa aqui  ====================
   =================================================================

   personagem (verde/amarelo/laranja/vermelho) NÃO é mais escolhida

   de rotação do personagem com a data "de hoje" do sistema. Você só
   precisa manter o campo "date" atualizado quando o personagem rodar
   de novo. O campo "color" antigo continua existindo no array, mas
   agora só é usado para os dois casos especiais que não dependem de
   data (veja o item 1).

   1) COMO FUNCIONA A COR AGORA (100% AUTOMÁTICO):
        - O Baú reseta toda SEXTA-FEIRA (ver WEEK_RESET_DAY logo
          abaixo, caso isso mude no futuro). Quem está na lista
          CURRENT_WEEK fica VERDE automaticamente, com a data da
          última sexta-feira — não importa em que dia da semana você
          realmente editou o código.
        - Quando você TIRA alguém da lista CURRENT_WEEK, o sistema já
          guarda sozinho (no navegador) a data em que isso aconteceu.
          Você NÃO precisa mais editar o campo "date" na mão. A partir
          daí a cor dele muda sozinha conforme os dias passam:
            8 a 30 dias  -> amarelo (até 1 mês)
            31 a 60 dias -> laranja (1 a 2 meses)
            61+ dias     -> vermelho (mais de 2 meses)
        - Casos manuais (não calculados, defina "color" no personagem):
            color:"blue"   -> item fixo / sem rotação
            color:"purple" -> ainda não rotacionou (ou deixe "date":"")

      RESUMO: toda semana, edite SÓ a lista CURRENT_WEEK (e NEXT_WEEK
      se quiser planejar). Não precisa mais tocar em "date" de
      ninguém — o sistema lembra sozinho.

      LIMITAÇÃO HONESTA: essa "memória" fica guardada no navegador de
      quem acessa a página (localStorage), não em um servidor. Se
      você sempre editar/conferir pelo mesmo computador, funciona
      100% sozinho. Se quiser que fique idêntico para qualquer
      visitante em qualquer aparelho, é necessário um backend/banco
      de dados de verdade — nesse caso é só pedir para evoluirmos o
      sistema.

   2) CALENDÁRIO DO SISTEMA (data de "hoje"):
      Logo abaixo tem SYSTEM_DATE_OVERRIDE. Deixe "" (vazio) para o
      sistema usar a data real do dia automaticamente (recomendado).
      Se quiser testar como o site ficará em uma data futura/passada,
      preencha no formato "DD/MM/AAAA", ex: "20/08/2026".

   3) IMAGEM: campo "img" é opcional. Cole o link direto da imagem
      (ex: "https://meusite.com/imagens/zoro.png").
      Se deixar "" ou remover o campo, mostra as iniciais do nome
      como no exemplo (bolinha com "ZO", "LU" etc).

   4) SEMANA ATUAL / PRÓXIMA SEMANA: são as listas CURRENT_WEEK e
      NEXT_WEEK logo abaixo. Cada uma tem exatamente 6 NOMES (texto
      simples), na ordem Baú 1 (3 primeiros) e Baú 2 (3 últimos).
      A imagem de cada um é buscada automaticamente na lista
      CHARACTERS pelo nome — não precisa colar link de novo.
      Importante: o nome tem que ser IDÊNTICO ao usado lá embaixo
      em CHARACTERS (maiúsculas/minúsculas incluso).

   5) LISTA COMPLETA: array CHARACTERS, um objeto por personagem:
        name  -> nome exibido
        role  -> "Tank" | "Bruiser" | "DPS" | "Support"
        date  -> data da última rotação, formato "DD/MM", ex: "15/05"
        color -> deixe como está para cálculo automático; use "blue"
                 ou "purple" apenas para os casos especiais do item 1
        img   -> (opcional) link da imagem
================================================================= */

// ---------- CALENDÁRIO DO SISTEMA ----------

// =================================================================
// ===============  CALENDÁRIO DO SISTEMA (automático)  ============
// =================================================================

// "Hoje", segundo o sistema: usa SYSTEM_DATE_OVERRIDE se preenchido,
// senão usa a data real do dispositivo/servidor no momento em que a
// página é carregada.
function getSystemToday(){
  if(SYSTEM_DATE_OVERRIDE && SYSTEM_DATE_OVERRIDE.trim() !== ""){
    const [dd, mm, yyyy] = SYSTEM_DATE_OVERRIDE.split("/").map(Number);
    const d = new Date(yyyy, (mm||1)-1, dd||1);
    if(!isNaN(d.getTime())) return d;
  }
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}

const SYSTEM_TODAY = getSystemToday();

// Dia da semana em que o Baú reseta. 0=domingo, 1=segunda, ... 5=sexta, 6=sábado.
const WEEK_RESET_DAY = 5; // sexta-feira

// Retorna a data da última sexta-feira (ou a própria data, se hoje já
// for sexta). É essa data — e não o dia exato em que você mexeu no
// código — que representa "quando a rotação atual começou".
function getLastResetDate(d){
  const weekday = d.getDay();
  const diff = (weekday - WEEK_RESET_DAY + 7) % 7;
  const result = new Date(d);
  result.setDate(d.getDate() - diff);
  return result;
}

const CURRENT_ROTATION_DATE = getLastResetDate(SYSTEM_TODAY);

// Nomes que estão na rotação desta semana (usado para forçar a cor
// verde automaticamente, sem precisar editar o campo "date").
const CURRENT_WEEK_SET = new Set(CURRENT_WEEK);

// Formata a data de hoje como "DD/MM" para exibir no card de quem
// está na rotação atual (mesmo que o campo "date" salvo esteja
// desatualizado).
function formatDDMM(d){
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  return `${dd}/${mm}`;
}

// =================================================================
// =====  MEMÓRIA AUTOMÁTICA DE ROTAÇÃO (100% sem digitar "date") ==
// =================================================================
// Toda vez que a página carrega, o sistema guarda no navegador
// (localStorage) a data em que cada personagem foi visto na lista
// CURRENT_WEEK. Assim, quando você tira alguém dessa lista, o
// sistema já sabe automaticamente "ele saiu no dia X" — sem você
// precisar editar o campo "date" na mão.
//
// Observação: essa memória fica salva no navegador de quem acessa a
// página. Se você sempre editar/conferir pelo mesmo computador, tudo
// funciona 100% sozinho. Se quiser que funcione igual para qualquer
// visitante em qualquer aparelho, isso exigiria um banco de dados
// real (servidor) — me avise se quiser evoluir para isso também.
const STORAGE_KEY_LOG = "bauSemanal_rotationLog_v1";

function loadRotationLog(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_LOG);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}

function saveRotationLog(log){
  try{ localStorage.setItem(STORAGE_KEY_LOG, JSON.stringify(log)); }catch(e){}
}

// Atualiza o log: todo nome presente em CURRENT_WEEK hoje recebe a
// data de hoje como "última vez visto na rotação". Quem sai da lista
// simplesmente para de ser atualizado, então fica congelado na
// última data em que esteve lá — exatamente o que precisamos para
// contar os dias corretamente.
function updateRotationLog(){
  const log = loadRotationLog();
  const resetStr = formatDDMM(CURRENT_ROTATION_DATE);
  CURRENT_WEEK.forEach(name=>{
    log[name] = resetStr;
  });
  saveRotationLog(log);
  return log;
}

const ROTATION_LOG = updateRotationLog();

// Data "efetiva" de um personagem: usa o log automático se existir,
// senão cai para o campo "date" digitado manualmente no CHARACTERS
// (isso cobre o primeiro carregamento, antes de existir histórico).
function getEffectiveDate(c){
  return ROTATION_LOG[c.name] || c.date;
}

// Converte "DD/MM" em Date, assumindo o ano mais próximo de hoje.
// Se a data cair mais de ~6 meses no futuro em relação a hoje,
// assume que é do ano anterior (evita erro na virada do ano).
function parseRotationDate(dateStr, todayDate){
  if(!dateStr) return null;
  const parts = dateStr.split("/").map(Number);
  const dd = parts[0], mm = parts[1];
  if(!dd || !mm) return null;
  let year = todayDate.getFullYear();
  let d = new Date(year, mm - 1, dd);
  const diffDays = Math.round((todayDate - d) / 86400000);
  if(diffDays < -183){
    d = new Date(year - 1, mm - 1, dd);
  }
  return d;
}

function daysSinceRotation(dateStr, todayDate){
  const d = parseRotationDate(dateStr, todayDate);
  if(!d) return null;
  return Math.floor((todayDate - d) / 86400000);
}

// Calcula a cor automaticamente. "blue" e "purple" continuam manuais
// pois representam estados que não têm relação com contagem de dias.
function getAutoColor(c, todayDate){
  if(CURRENT_WEEK_SET.has(c.name)) return "green"; // está na rotação desta semana
  if(c.color === "blue") return "blue";
  const effDate = getEffectiveDate(c);
  if(!effDate || c.color === "purple") return "purple";

  const days = daysSinceRotation(effDate, todayDate);
  if(days === null) return "purple";
  if(days < 0) return "green";      // data agendada para o futuro (rotação já definida)
  if(days <= 7) return "green";     // semana atual
  if(days <= 30) return "yellow";   // até 1 mês
  if(days <= 60) return "orange";   // 1 a 2 meses
  return "red";                     // mais de 2 meses
}

function initials(name){
  return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
}

function avatarHTML(c){
  if(c.img){
    return `<img src="${c.img}" alt="${c.name}" loading="lazy" style="width:100%;height:100%;object-fit:contain;" onerror="this.parentElement.textContent='${initials(c.name)}';">`;
  }
  return initials(c.name);
}

function findCharacter(name){
  const found = CHARACTERS.find(c => c.name === name);
  if(!found){
    console.warn(`Personagem "${name}" não encontrado em CHARACTERS. Confira a grafia.`);
    return {name, img:""};
  }
  return found;
}

function renderWeekCards(container, names){
  container.innerHTML = "";
  const list = names.map(findCharacter);
  const bau1 = list.slice(0,3);
  const bau2 = list.slice(3,6);
  [["Baú 1",bau1],["Baú 2",bau2]].forEach(([label, group])=>{
    const row = document.createElement("div");
    row.className = "bau-row";
    const lbl = document.createElement("div");
    lbl.className = "bau-label";
    lbl.textContent = label;
    row.appendChild(lbl);
    group.forEach(c=>{
      const card = document.createElement("div");
      card.className = "chest-card";
      card.innerHTML = `<div class="avatar">${avatarHTML(c)}</div><div class="name">${c.name}</div>`;
      row.appendChild(card);
    });
    container.appendChild(row);
  });
}

renderWeekCards(document.getElementById("current-week"), CURRENT_WEEK);
renderWeekCards(document.getElementById("next-week"), NEXT_WEEK);

// ---------------- Grid principal ----------------
let activeRoles = new Set();
const searchInput = document.getElementById("search");
const sortSelect = document.getElementById("sort");
const hideNone = document.getElementById("hide-none");
const grid = document.getElementById("char-grid");

document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const role = btn.dataset.role;
    if(activeRoles.has(role)){
      activeRoles.delete(role);
      btn.classList.remove("active");
    } else {
      activeRoles.add(role);
      btn.classList.add("active");
    }
    renderGrid();
  });
});
searchInput.addEventListener("input", renderGrid);
sortSelect.addEventListener("change", renderGrid);
hideNone.addEventListener("change", renderGrid);

// helper pra ordenar por data no formato "DD/MM", usando o mesmo
// calendário do sistema (SYSTEM_TODAY) para resolver o ano corretamente
function parseDMY(d){
  const parsed = parseRotationDate(d, SYSTEM_TODAY);
  return parsed || new Date(0);
}

function renderGrid(){
  let list = [...CHARACTERS];

  if(hideNone.checked){
    list = list.filter(c => getAutoColor(c, SYSTEM_TODAY) !== "blue");
  }

  const q = searchInput.value.trim().toLowerCase();
  if(q){
    list = list.filter(c=>c.name.toLowerCase().includes(q));
  }

  if(activeRoles.size > 0){
    list = list.filter(c=>activeRoles.has(c.role));
  }

  const sortVal = sortSelect.value;
  list.sort((a,b)=>{
    if(sortVal === "name-asc") return a.name.localeCompare(b.name);
    if(sortVal === "name-desc") return b.name.localeCompare(a.name);
    if(sortVal === "date-asc") return parseDMY(getEffectiveDate(a)) - parseDMY(getEffectiveDate(b));
    if(sortVal === "date-desc") return parseDMY(getEffectiveDate(b)) - parseDMY(getEffectiveDate(a));
    return 0;
  });

  grid.innerHTML = "";
  if(list.length === 0){
    grid.innerHTML = `<div class="empty-msg">Nenhum personagem encontrado.</div>`;
    return;
  }

  list.forEach(c=>{
    const color = getAutoColor(c, SYSTEM_TODAY);
    const card = document.createElement("div");
    card.className = `card status-${color}`;
    const dateLabel = color === "blue" ? "Fixo"
      : color === "purple" ? "—"
      : CURRENT_WEEK_SET.has(c.name) ? formatDDMM(CURRENT_ROTATION_DATE)
      : (getEffectiveDate(c) || "—");
    card.innerHTML = `
      <div class="img">${avatarHTML(c)}</div>
      <div class="date-bar">${dateLabel}</div>
      <div class="cname">${c.name}</div>
    `;
    grid.appendChild(card);
  });
}

renderGrid();
</script>
